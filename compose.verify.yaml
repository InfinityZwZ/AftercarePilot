# Explicitly separate project/ports via .local/compose.verify.env. Not for production.
services:
  api:
    build:
      target: verification
    command: ["python", "-m", "scripts.start_api", "--verification"]
    environment:
      AFTERCARE_VERIFICATION: "1"
      OPENAI_API_KEY: ""
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:?Run scripts.configure_compose --verification}
      TEST_READONLY_DATABASE_URL: ${TEST_READONLY_DATABASE_URL:?Run scripts.configure_compose --verification}
      TEST_BOOTSTRAP_DATABASE_URL: ${BOOTSTRAP_DATABASE_URL:?Run scripts.configure_compose --verification}
